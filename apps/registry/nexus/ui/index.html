<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEIA React App Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #071D28;
    }

    #root {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Only center content when it is the loading logo */
    #root:empty,
    #root>.loading-logo {
      margin: auto;
      align-self: center;
    }

    .loading-logo {
      max-width: 200px;
      margin: auto;
    }
  </style>
</head>

<body>
  <div id="root">
    <img src="/src/assets/logo.svg" class="loading-logo" alt="Loading..." />
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
