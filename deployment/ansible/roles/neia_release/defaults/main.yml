neia_repo_local_path: "{{ inventory_dir }}/../../.."
neia_release_local_path: ""
neia_release_local_dir: "{{ neia_repo_local_path }}/neia-api/dist"
neia_release_local_pattern: "nexus_n3_neia_api-*-py3-none-any.whl"
neia_release_remote_dir: /tmp
neia_install_root: /opt/nexus-n3-neia-app-framework
neia_api_dir: "{{ neia_install_root }}/neia-api"
neia_venv_path: "{{ neia_api_dir }}/.venv"
neia_config_root: /etc/nexus-n3-neia-app-framework
neia_config_file: "{{ neia_config_root }}/neia.env"
neia_state_root: /var/lib/nexus-n3-neia-app-framework
neia_log_root: /var/log/nexus-n3-neia-app-framework
neia_runtime_directory: nexus-n3-neia-app-framework
neia_run_root: "/run/{{ neia_runtime_directory }}"
neia_installed_file: "{{ neia_state_root }}/installed.json"
neia_workflows_dir: "{{ neia_state_root }}/workflows"
neia_gateway_settings_file: "{{ neia_state_root }}/.neia_gateway_settings.json"
neia_service_name: nexus-n3-neia-app-framework
neia_service_user: "{{ ansible_user }}"
neia_service_group: "{{ ansible_user }}"
neia_host: 0.0.0.0
neia_port: 8080
neia_dev: 0
neia_dev_fallback: true
neia_gateway: zeromq
neia_ai_node: false
neia_discover_master: true
neia_master_discovery_timeout: 5
neia_master_host: nexus-n3-master.local
neia_master_cmd_port: 5555
neia_master_event_port: 5556
neia_sync_delete: false
neia_sync_models: false
neia_local_ui_dist: "{{ neia_repo_local_path }}/neia-ui/dist"
neia_local_apps_path: "{{ neia_repo_local_path }}/apps"
neia_local_docs_path: "{{ neia_repo_local_path }}/docs"
neia_local_models_path: "{{ neia_repo_local_path }}/models"
neia_local_shared_steps_path: "{{ neia_repo_local_path }}/shared/steps.json"
neia_local_workflows_path: "{{ neia_repo_local_path }}/workflows"
neia_runtime_app_sync_excludes:
  - "*/package-lock.json"
  - "*/todo.txt"
  - "*/ui/src"
  - "*/ui/src/**"
  - "*/ui/node_modules"
  - "*/ui/node_modules/**"
  - "*/ui/dist"
  - "*/ui/dist/**"
  - "*/ui/package.json"
  - "*/ui/tsconfig.json"
  - "*/ui/tsconfig.*.json"
  - "*/ui/vite.config.ts"
  - "*/ui/architecture_design.md"
  - "*/ui/documentation.md"
  - "*/ui/*.map"
  - "**/__pycache__"
  - "**/.DS_Store"
neia_site: lab
neia_voice_enabled: false
neia_voice_tts_enabled: false
neia_voice_device: pulse
neia_voice_wakeword: nexus
neia_voice_wakeword_aliases: ""
neia_voice_model_path: ""
neia_voice_sample_rate: 16000
neia_voice_debug: false
neia_voice_device_auto: true
neia_voice_stt_engine: vosk
neia_voice_stt_model: base
neia_voice_stt_device: cpu
neia_voice_stt_compute_type: int8
neia_voice_stt_language: en
neia_voice_stt_chunk_seconds: 1.2
neia_voice_tts_engine: piper
neia_voice_tts_bin: espeak-ng
neia_voice_tts_voice: en-us
neia_voice_tts_piper_model: /opt/nexus-n3-neia-app-framework/models/piper/en_GB-southern_english_female-low.onnx
neia_voice_tts_piper_player: aplay
neia_voice_tts_piper_player_device: plughw:0,0
neia_voice_tts_piper_player_args: ""
neia_voice_tts_pad_lead_ms: 0
neia_voice_tts_pad_tail_ms: 320
neia_voice_tts_output_latency_ms: 0
neia_voice_flow_step_delay_ms: 120
neia_voice_flow_mode: ui
neia_help_docs_roots: /opt/rs-nexus-os/docs:/opt/nexus-n3-neia-app-framework/docs

neia_service_uid: 1000
neia_xdg_runtime_dir: "/run/user/{{ neia_service_uid }}"
neia_pulse_server: "unix:/run/user/{{ neia_service_uid }}/pulse/native"
neia_service_path: "{{ neia_venv_path }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
neia_service_env:
  NEIA_HOST: "{{ neia_host }}"
  NEIA_PORT: "{{ neia_port }}"
  NEIA_DEV: "{{ neia_dev }}"
  NEIA_DEV_FALLBACK: "{{ 1 if neia_dev_fallback | bool else 0 }}"
  NEIA_GATEWAY: "{{ neia_gateway }}"
  NEIA_AI_NODE: "{{ 1 if neia_ai_node | bool else 0 }}"
  NEIA_DISCOVER_MASTER: "{{ 1 if neia_discover_master | bool else 0 }}"
  NEIA_MASTER_DISCOVERY_TIMEOUT: "{{ neia_master_discovery_timeout }}"
  NEIA_MASTER_HOST: "{{ neia_master_host }}"
  NEIA_MASTER_CMD_PORT: "{{ neia_master_cmd_port }}"
  NEIA_MASTER_EVENT_PORT: "{{ neia_master_event_port }}"
  NEIA_SITE: "{{ neia_site }}"
  NEIA_CONTENT_ROOT: "{{ neia_install_root }}"
  NEIA_REGISTRY_DIR: "{{ neia_install_root }}/apps/registry"
  NEIA_INSTALLED_FILE: "{{ neia_installed_file }}"
  NEIA_STATE_DIR: "{{ neia_state_root }}"
  NEIA_LOG_DIR: "{{ neia_log_root }}"
  NEIA_RUN_DIR: "{{ neia_run_root }}"
  NEIA_WORKFLOWS_DIR: "{{ neia_workflows_dir }}"
  NEIA_VOICE_ENABLED: "{{ 1 if neia_voice_enabled | bool else 0 }}"
  NEIA_VOICE_WAKEWORD: "{{ neia_voice_wakeword }}"
  NEIA_VOICE_WAKEWORD_ALIASES: "{{ neia_voice_wakeword_aliases }}"
  NEIA_VOICE_MODEL_PATH: "{{ neia_voice_model_path }}"
  NEIA_VOICE_TTS_ENABLED: "{{ 1 if neia_voice_tts_enabled | bool else 0 }}"
  NEIA_VOICE_DEVICE: "{{ neia_voice_device }}"
  NEIA_VOICE_SAMPLE_RATE: "{{ neia_voice_sample_rate }}"
  NEIA_VOICE_DEBUG: "{{ 1 if neia_voice_debug | bool else 0 }}"
  NEIA_VOICE_DEVICE_AUTO: "{{ 1 if neia_voice_device_auto | bool else 0 }}"
  NEIA_VOICE_STT_ENGINE: "{{ neia_voice_stt_engine }}"
  NEIA_VOICE_STT_MODEL: "{{ neia_voice_stt_model }}"
  NEIA_VOICE_STT_DEVICE: "{{ neia_voice_stt_device }}"
  NEIA_VOICE_STT_COMPUTE_TYPE: "{{ neia_voice_stt_compute_type }}"
  NEIA_VOICE_STT_LANGUAGE: "{{ neia_voice_stt_language }}"
  NEIA_VOICE_STT_CHUNK_SECONDS: "{{ neia_voice_stt_chunk_seconds }}"
  NEIA_VOICE_TTS_ENGINE: "{{ neia_voice_tts_engine }}"
  NEIA_VOICE_TTS_BIN: "{{ neia_voice_tts_bin }}"
  NEIA_VOICE_TTS_VOICE: "{{ neia_voice_tts_voice }}"
  NEIA_VOICE_TTS_PIPER_BIN: "{{ neia_venv_path }}/bin/piper"
  NEIA_VOICE_TTS_PIPER_MODEL: "{{ neia_voice_tts_piper_model }}"
  NEIA_VOICE_TTS_PIPER_PLAYER: "{{ neia_voice_tts_piper_player }}"
  NEIA_VOICE_TTS_PIPER_PLAYER_DEVICE: "{{ neia_voice_tts_piper_player_device }}"
  NEIA_VOICE_TTS_PIPER_PLAYER_ARGS: "{{ neia_voice_tts_piper_player_args }}"
  NEIA_VOICE_TTS_PAD_LEAD_MS: "{{ neia_voice_tts_pad_lead_ms }}"
  NEIA_VOICE_TTS_PAD_TAIL_MS: "{{ neia_voice_tts_pad_tail_ms }}"
  NEIA_VOICE_TTS_OUTPUT_LATENCY_MS: "{{ neia_voice_tts_output_latency_ms }}"
  NEIA_VOICE_FLOW_STEP_DELAY_MS: "{{ neia_voice_flow_step_delay_ms }}"
  NEIA_VOICE_FLOW_MODE: "{{ neia_voice_flow_mode }}"
  NEIA_HELP_DOCS_ROOTS: "{{ neia_help_docs_roots }}"
  XDG_RUNTIME_DIR: "{{ neia_xdg_runtime_dir }}"
  PULSE_SERVER: "{{ neia_pulse_server }}"
  PATH: "{{ neia_service_path }}"
