- name: Check explicitly configured local NEIA release artifact
  ansible.builtin.stat:
    path: "{{ neia_release_local_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_release_local_stat
  when: neia_release_local_path | length > 0

- name: Find locally built NEIA release artifacts
  ansible.builtin.find:
    paths: "{{ neia_release_local_dir }}"
    patterns: "{{ neia_release_local_pattern }}"
    file_type: file
    recurse: false
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_release_candidates
  when: neia_release_local_path | length == 0

- name: Fail if explicitly configured NEIA release artifact is missing
  ansible.builtin.fail:
    msg: "Missing NEIA release artifact at {{ neia_release_local_path }}"
  when:
    - neia_release_local_path | length > 0
    - not neia_release_local_stat.stat.exists

- name: Fail if no locally built NEIA release artifact was found
  ansible.builtin.fail:
    msg: >-
      Missing NEIA release artifact matching
      {{ neia_release_local_dir }}/{{ neia_release_local_pattern }}
  when:
    - neia_release_local_path | length == 0
    - neia_release_candidates.matched == 0

- name: Resolve NEIA release artifact paths
  ansible.builtin.set_fact:
    neia_release_resolved_local_path: >-
      {{ neia_release_local_path if neia_release_local_path | length > 0
         else (neia_release_candidates.files | sort(attribute='mtime') | last).path }}
    neia_release_resolved_remote_path: >-
      {{ neia_release_remote_dir }}/{{
         (neia_release_local_path if neia_release_local_path | length > 0
          else (neia_release_candidates.files | sort(attribute='mtime') | last).path) | basename }}

- name: Check local NEIA repo content root
  ansible.builtin.stat:
    path: "{{ neia_repo_local_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_repo_local_stat

- name: Fail if local NEIA repo content root is missing
  ansible.builtin.fail:
    msg: "Missing local repo at {{ neia_repo_local_path }}"
  when: not neia_repo_local_stat.stat.exists

- name: Check local NEIA UI dist
  ansible.builtin.stat:
    path: "{{ neia_local_ui_dist }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_ui_dist_stat

- name: Fail if local NEIA UI dist is missing
  ansible.builtin.fail:
    msg: "Missing {{ neia_local_ui_dist }}. Build neia-ui before deployment."
  when: not neia_ui_dist_stat.stat.exists

- name: Check local NEIA apps runtime tree
  ansible.builtin.stat:
    path: "{{ neia_local_apps_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_apps_stat

- name: Fail if local NEIA apps runtime tree is missing
  ansible.builtin.fail:
    msg: "Missing local apps at {{ neia_local_apps_path }}"
  when: not neia_apps_stat.stat.exists

- name: Check local NEIA shared steps file
  ansible.builtin.stat:
    path: "{{ neia_local_shared_steps_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_shared_steps_stat

- name: Fail if local NEIA shared steps file is missing
  ansible.builtin.fail:
    msg: "Missing shared steps at {{ neia_local_shared_steps_path }}"
  when: not neia_shared_steps_stat.stat.exists

- name: Check local NEIA docs tree
  ansible.builtin.stat:
    path: "{{ neia_local_docs_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_docs_stat

- name: Check local NEIA workflows tree
  ansible.builtin.stat:
    path: "{{ neia_local_workflows_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_workflows_stat

- name: Check local NEIA models directory when model sync is enabled
  ansible.builtin.stat:
    path: "{{ neia_local_models_path }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: neia_models_stat
  when: neia_sync_models | bool

- name: Fail if local NEIA models directory is missing when model sync is enabled
  ansible.builtin.fail:
    msg: "Missing local models at {{ neia_local_models_path }}"
  when:
    - neia_sync_models | bool
    - not neia_models_stat.stat.exists

- name: Ensure NEIA install root exists
  ansible.builtin.file:
    path: "{{ neia_install_root }}"
    state: directory
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0755"

- name: Ensure NEIA configuration root exists
  ansible.builtin.file:
    path: "{{ neia_config_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure NEIA persistent directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0755"
  loop:
    - "{{ neia_state_root }}"
    - "{{ neia_workflows_dir }}"
    - "{{ neia_log_root }}"

- name: Ensure NEIA runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0755"
  loop:
    - "{{ neia_install_root }}/apps"
    - "{{ neia_install_root }}/apps/registry"
    - "{{ neia_install_root }}/shared"
    - "{{ neia_install_root }}/neia-ui"
    - "{{ neia_install_root }}/docs"

- name: Check for persistent installed-app state
  ansible.builtin.stat:
    path: "{{ neia_installed_file }}"
  register: neia_installed_state_stat

- name: Check for legacy installed-app state
  ansible.builtin.stat:
    path: "{{ neia_install_root }}/apps/installed.json"
  register: neia_legacy_installed_state_stat

- name: Migrate legacy installed-app state
  ansible.builtin.copy:
    src: "{{ neia_install_root }}/apps/installed.json"
    dest: "{{ neia_installed_file }}"
    remote_src: true
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0644"
  when:
    - not neia_installed_state_stat.stat.exists
    - neia_legacy_installed_state_stat.stat.exists

- name: Seed installed-app state from the release
  ansible.builtin.copy:
    src: "{{ neia_local_apps_path }}/installed.json"
    dest: "{{ neia_installed_file }}"
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0644"
    force: false
  when: not neia_legacy_installed_state_stat.stat.exists

- name: Check persistent workflow state
  ansible.builtin.find:
    paths: "{{ neia_workflows_dir }}"
    file_type: any
    hidden: true
    recurse: true
  register: neia_persistent_workflows

- name: Check legacy workflow state
  ansible.builtin.stat:
    path: "{{ neia_install_root }}/workflows"
  register: neia_legacy_workflows_stat

- name: Migrate legacy workflow state
  ansible.builtin.copy:
    src: "{{ neia_install_root }}/workflows/"
    dest: "{{ neia_workflows_dir }}/"
    remote_src: true
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: preserve
  when:
    - neia_persistent_workflows.matched == 0
    - neia_legacy_workflows_stat.stat.isdir | default(false)

- name: Seed workflow state from the release
  ansible.builtin.copy:
    src: "{{ neia_local_workflows_path }}/"
    dest: "{{ neia_workflows_dir }}/"
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: preserve
  when:
    - neia_persistent_workflows.matched == 0
    - not (neia_legacy_workflows_stat.stat.isdir | default(false))
    - neia_workflows_stat.stat.isdir | default(false)

- name: Check persistent gateway settings
  ansible.builtin.stat:
    path: "{{ neia_gateway_settings_file }}"
  register: neia_gateway_settings_stat

- name: Check legacy gateway settings
  ansible.builtin.stat:
    path: "{{ neia_install_root }}/.neia_gateway_settings.json"
  register: neia_legacy_gateway_settings_stat

- name: Migrate legacy gateway settings
  ansible.builtin.copy:
    src: "{{ neia_install_root }}/.neia_gateway_settings.json"
    dest: "{{ neia_gateway_settings_file }}"
    remote_src: true
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0644"
  when:
    - not neia_gateway_settings_stat.stat.exists
    - neia_legacy_gateway_settings_stat.stat.exists

- name: Sync NEIA shell UI build to target
  ansible.builtin.synchronize:
    src: "{{ neia_local_ui_dist }}/"
    dest: "{{ neia_install_root }}/neia-ui/dist/"
    delete: "{{ neia_sync_delete | bool }}"
  delegate_to: localhost
  become: false
  notify: Restart neia service

- name: Sync NEIA apps runtime content to target
  ansible.builtin.synchronize:
    src: "{{ neia_local_apps_path }}/"
    dest: "{{ neia_install_root }}/apps/"
    delete: "{{ neia_sync_delete | bool }}"
    rsync_opts: "{{ neia_runtime_app_sync_excludes | map('regex_replace', '^', '--exclude=') | list }}"
  delegate_to: localhost
  become: false
  notify: Restart neia service

- name: Copy NEIA shared steps file to target
  ansible.builtin.copy:
    src: "{{ neia_local_shared_steps_path }}"
    dest: "{{ neia_install_root }}/shared/steps.json"
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0644"
  notify: Restart neia service

- name: Sync NEIA docs to target when present
  ansible.builtin.synchronize:
    src: "{{ neia_local_docs_path }}/"
    dest: "{{ neia_install_root }}/docs/"
    delete: "{{ neia_sync_delete | bool }}"
  delegate_to: localhost
  become: false
  when: neia_docs_stat.stat.exists
  notify: Restart neia service

- name: Ensure NEIA models root exists when model sync is enabled
  ansible.builtin.file:
    path: "{{ neia_install_root }}/models"
    state: directory
    owner: "{{ neia_service_user }}"
    group: "{{ neia_service_group }}"
    mode: "0755"
  when: neia_sync_models | bool

- name: Sync NEIA models to target when enabled
  ansible.builtin.synchronize:
    src: "{{ neia_local_models_path }}/"
    dest: "{{ neia_install_root }}/models/"
    delete: false
  delegate_to: localhost
  become: false
  when: neia_sync_models | bool
  notify: Restart neia service

- name: Ensure NEIA API virtualenv exists
  ansible.builtin.command: >
    python3 -m venv {{ neia_venv_path }}
  args:
    creates: "{{ neia_venv_path }}/bin/activate"

- name: Upload NEIA release artifact
  ansible.builtin.copy:
    src: "{{ neia_release_resolved_local_path }}"
    dest: "{{ neia_release_resolved_remote_path }}"
    mode: "0644"
  notify: Restart neia service

- name: Install NEIA API wheel
  ansible.builtin.pip:
    name: "{{ neia_release_resolved_remote_path }}"
    virtualenv: "{{ neia_venv_path }}"
    virtualenv_command: "python3 -m venv"
    state: present
    extra_args: "--force-reinstall"
  notify: Restart neia service

- name: Install NEIA service environment
  ansible.builtin.template:
    src: neia.env.j2
    dest: "{{ neia_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart neia service

- name: Install NEIA systemd service
  ansible.builtin.template:
    src: neia-api.service.j2
    dest: "/etc/systemd/system/{{ neia_service_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart neia service

- name: Enable NEIA service
  ansible.builtin.systemd:
    name: "{{ neia_service_name }}"
    enabled: true
    state: started

- name: Check ufw status for ui port
  ansible.builtin.command: ufw status
  register: neia_release_ufw_status
  changed_when: false
  failed_when: false

- name: Allow ui port (TCP {{ neia_port }}) through ufw
  ansible.builtin.command: ufw allow {{ neia_port }}/tcp
  register: neia_release_ufw_allow_router
  changed_when: "'Skipping' not in neia_release_ufw_allow_router.stdout"
  when:
    - "'Status: active' in neia_release_ufw_status.stdout"
